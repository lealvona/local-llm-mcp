[project]
name = "local-llm-mcp"
version = "0.1.0"
description = "MCP server that delegates private-data or large-output work to a local LLM, with a per-session context that compacts when the caller's does"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leal Vona" }]
requires-python = ">=3.12"
keywords = ["mcp", "llm", "privacy", "pii", "claude-code", "local"]
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28",
]

[project.scripts]
local-llm-mcp = "local_llm_mcp.__main__:main"
local-llm-mcp-admin = "local_llm_mcp.admin:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_llm_mcp"]
